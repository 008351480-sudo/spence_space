
<!DOCTYPE html>

<html>
    <head>
        <title>Add Ingredients Manually - Spence Space</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <h1>Spence Space</h1>

        <nav class="navbar">
            <a href="index.html">My Fridges</a>
            <a href="discover.html">Discover</a>
            <a href="grocery.html">Grocery List</a>
            <a href="recipes.html">My Recipes</a>
        </nav>

        <div class="manual-container">

            <h2>Add Ingredients Manually</h2>

            <p>Enter the ingredients you want to add to your refrigerator.</p>

            <form class="manual-form">

                <label for="ingredient-name">Ingredient Name</label>
                <input
                    type="text"
                    id="ingredient-name"
                    name="ingredient-name"
                    placeholder="e.g. Eggs"
                    required
                >

                <label for="quantity">Quantity</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    placeholder="e.g. 12"
                    required
                >

                <label for="expiration">Expiration Date (Optional)</label>
                <input
                    type="date"
                    id="expiration"
                    name="expiration"
                >

                <button type="submit">Add Ingredients to Fridge</button>

            </form>

        </div>

    </body>
</html>
