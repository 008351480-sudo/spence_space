<!DOCTYPE html> 

<html> 
    <head>
        <title>Add Refrigerator</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Add Refrigerator</h1>

        <form class="add-fridge-form">
            <label for="fridge-name">Name</label>
            <input type="text" id="fridge-name" name="fridge-name" required>

            <label for="location">Location:</label>
            <select id="location" name="location">
                <option>Kitchen</option>
                <option>Bedroom</option>
                <option>Garage</option>
                <option>Backyard</option>
                <option>Other</option>
            </select>

            <button type="submit">Create Refrigerator</button>
        </form>

    </body>
</html>
