
<!DOCTYPE html>

<html>
    <head>
        <title>Scan Barcode - Spence Space</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header class="site-header">
            <a href="index.html">
                <img src="images/Transparent-Logo.png"
                    alt="Spence Space Logo"
                    class="site-logo">
            </a>
        </header>

        <nav class="navbar">
            <a href="index.html">My Fridges</a>
            <a href="discover.html">Discover</a>
            <a href="grocery.html">Grocery List</a>
            <a href="recipes.html">My Recipes</a>
        </nav>

        <div class="barcode-container">

            <h2>Scan Ingredient Barcode</h2>

            <p>Scan a product barcode to add an ingredient to your refrigerator.</p>

            <div class="barcode-scanner">
                <p>Position barcode here</p>
            </div>

            <button type="button">Scan Barcode</button>

            <h3>Ingredient Information</h3>

            <form class="barcode-form">

                <label for="ingredient">Ingredient Name</label>
                <input
                    type="text"
                    id="ingredient"
                    name="ingredient"
                    required
                >

                <label for="quantity">Quantity</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    required
                >

                <label for="expiration">Expiration Date (Optional)</label>
                <input
                    type="date"
                    id="expiration"
                    name="expiration"
                >

                <button type="submit">Add Ingredient to Fridge</button>

            </form>

        </div>

    </body>
</html>
