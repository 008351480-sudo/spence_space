
<!DOCTYPE html>

<html>
    <head>
        <title>Verify Receipt - Spence Space</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header class="site-header">
            <a href="index.html">
                <img src="images/Transparent-Logo.png"
                    alt="Spence Space Logo"
                    class="site-logo">
            </a>
        </header>

        <nav class="navbar">
            <a href="index.html">My Fridges</a>
            <a href="discover.html">Discover</a>
            <a href="grocery.html">Grocery List</a>
            <a href="recipes.html">My Recipes</a>
        </nav>

        <div class="verify-container">

            <h2>Verify Receipt Ingredients</h2>

            <p>
                Review the ingredients detected from your receipt.
                Make any corrections before adding them to your refrigerator.
            </p>

            <form class="verify-form">

                <table class="verify-table">
                    <thead>
                        <tr>
                            <th>Ingredient</th>
                            <th>Quantity</th>
                            <th>Expiration Date</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>
                                <input type="text" name="ingredient[]" value="Milk">
                            </td>
                            <td>
                                <input type="number" name="quantity[]" value="1" min="1">
                            </td>
                            <td>
                                <input type="date" name="expiration[]">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <input type="text" name="ingredient[]" value="Eggs">
                            </td>
                            <td>
                                <input type="number" name="quantity[]" value="12" min="1">
                            </td>
                            <td>
                                <input type="date" name="expiration[]">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <input type="text" name="ingredient[]" value="Bread">
                            </td>
                            <td>
                                <input type="number" name="quantity[]" value="1" min="1">
                            </td>
                            <td>
                                <input type="date" name="expiration[]">
                            </td>
                        </tr>
                    </tbody>
                </table>

                <button type="submit">Add All to Fridge</button>

            </form>

        </div>

    </body>
</html>
